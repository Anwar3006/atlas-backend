sonar.projectKey=Anwar3006_atlas-backend
sonar.organization=anwar3006
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mirrors vitest.config.ts's own coverage.exclude list -- vitest not
# instrumenting these files (bootstrap glue: server startup, a DB
# connection client, a migration runner, plus declarative Drizzle table
# definitions with no branching logic) doesn't by itself stop SonarCloud
# from counting their un-instrumented lines as uncovered "new code" against
# the LCOV report it reads; this exclusion has to be told separately.
sonar.coverage.exclusions=src/index.ts,src/db/**
