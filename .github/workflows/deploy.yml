name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Everything up through pushing the image runs on GitHub-hosted runners --
  # no VPS network access needed for any of this.
  scan-and-build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR/Docker image names must be lowercase; github.repository preserves
      # whatever case the owner/repo actually has on GitHub.
      - name: Compute image reference
        id: image
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # --- 1. Trivy filesystem scan ---
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      # --- 2. OWASP Dependency-Check ---
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: atlas-backend
          path: .
          format: HTML
          args: >
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      # --- 3. SonarCloud scan ---
      # sonarcloud-github-action is deprecated; sonarqube-scan-action is its
      # drop-in replacement (works for SonarCloud with no SONAR_HOST_URL needed,
      # as long as sonar-project.properties has sonar.organization + sonar.projectKey).
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      # --- 4. Build the Docker image (not pushed yet -- the image scan below gates the push) ---
      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 5. Trivy image scan ---
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 6. Push the image to GHCR, tagged with the commit SHA ---
      - name: Push image
        run: docker push ${{ steps.image.outputs.ref }}

  # --- 7. Deploy: runs on a self-hosted runner living on the VPS itself,
  # under the low-privilege `deploy` account (A7) -- no inbound SSH from
  # GitHub needed at all, since the runner polls GitHub over outbound
  # HTTPS instead of GitHub connecting in.
  deploy:
    needs: scan-and-build
    if: needs.scan-and-build.result == 'success'
    runs-on: [self-hosted, atlas-vps]
    steps:
      - name: Set image and wait for rollout
        run: |
          export KUBECONFIG=/home/deploy/.kube/config
          kubectl set image deployment/backend backend=${{ needs.scan-and-build.outputs.image }} -n atlas
          kubectl rollout status deployment/backend -n atlas --timeout=120s

  # Reports the combined outcome of both jobs above, regardless of which one
  # failed (or whether deploy was skipped because scan-and-build failed first).
  notify:
    needs: [scan-and-build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: ravsamhq/notify-slack-action@2.5.0
        with:
          status: ${{ (needs.scan-and-build.result == 'success' && needs.deploy.result == 'success') && 'success' || 'failure' }}
          notification_title: "{workflow} has {status_message}"
          message_format: "{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>"
          footer: "<{workflow_url}|View Workflow>"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
