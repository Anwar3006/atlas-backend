name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Everything up through pushing the image runs on GitHub-hosted runners --
  # no VPS network access needed for any of this.
  scan-and-build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    # Epic 1: the auth tests write real rows (sign-up/sign-in/session), so
    # they need a live Postgres to run against -- this runner has none by
    # default. A throwaway container scoped to just this job, gone once the
    # job ends; fixed local-only credentials, not touching production Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://atlas_ci:atlas_ci@localhost:5432/atlas_ci
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR/Docker image names must be lowercase; github.repository preserves
      # whatever case the owner/repo actually has on GitHub.
      - name: Compute image reference
        id: image
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Epic 1 auth tables live only as migration files until applied --
      # same command Story 2 documents for local dev, run here against the
      # ephemeral postgres service above instead of a developer's machine.
      - name: Apply database migrations
        run: pnpm db:migrate

      # Tests run before any scan -- fail fast on broken code, and this is
      # also what generates coverage/lcov.info for the SonarCloud step below
      # (sonar-project.properties points at it via sonar.javascript.lcov.reportPaths).
      - name: Run tests with coverage
        run: pnpm test:coverage

      # --- 1. Trivy filesystem scan ---
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      # --- 2. OWASP Dependency-Check ---
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: atlas-backend
          path: .
          format: HTML
          args: >
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --disableYarnAudit
            --suppression owasp-suppressions.xml

      # --- 3. SonarCloud scan ---
      # sonarcloud-github-action is deprecated; sonarqube-scan-action is its
      # drop-in replacement (works for SonarCloud with no SONAR_HOST_URL needed,
      # as long as sonar-project.properties has sonar.organization + sonar.projectKey).
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      # --- 4. Build the Docker image (not pushed yet -- the image scan below gates the push) ---
      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 5. Trivy image scan ---
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 6. Push the image to GHCR, tagged with the commit SHA ---
      - name: Push image
        run: docker push ${{ steps.image.outputs.ref }}

  # --- 7. Deploy: runs on a self-hosted runner living on the VPS itself,
  # under the low-privilege `deploy` account (A7) -- no inbound SSH from
  # GitHub needed at all, since the runner polls GitHub over outbound
  # HTTPS instead of GitHub connecting in.
  deploy:
    needs: scan-and-build
    if: needs.scan-and-build.result == 'success'
    runs-on: [self-hosted, atlas-vps]
    steps:
      - name: Set image and wait for rollout
        run: |
          export KUBECONFIG=/home/deploy/.kube/config
          kubectl set image deployment/backend backend=${{ needs.scan-and-build.outputs.image }} -n atlas
          kubectl rollout status deployment/backend -n atlas --timeout=120s

  # A12: generated from the just-deployed live spec (not the local build), so
  # the published client always reflects what's actually running -- hence
  # needing deploy to have succeeded first, not just scan-and-build.
  publish-client:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # client/ is its own pnpm project (packageManager field pins the exact
      # version, same as atlas-backend's own package.json) -- pnpm only,
      # never npm, per AGENTS.md.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: client/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@anwar3006"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client scaffold dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript client with hey-api
        working-directory: client
        env:
          OPENAPI_SPEC_URL: https://atlas-api.curiousfellow.top/openapi.json
        run: pnpm run generate

      - name: Build
        working-directory: client
        run: pnpm run build

      # Every publish needs a unique version; tie it to the commit so mobile
      # can pin an exact backend commit's client (A12: "bumps the version
      # whenever it wants to pick up backend changes").
      - name: Set package version to commit SHA
        working-directory: client
        run: pnpm version "0.0.0-${{ github.sha }}" --no-git-tag-version --no-git-checks

      - name: Publish to GitHub Packages
        working-directory: client
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Reports the combined outcome of the jobs above, regardless of which one
  # failed (or whether a later job was skipped because an earlier one failed).
  notify:
    needs: [scan-and-build, deploy, publish-client]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: ravsamhq/notify-slack-action@2.5.0
        with:
          status: ${{ (needs.scan-and-build.result == 'success' && needs.deploy.result == 'success' && needs.publish-client.result == 'success') && 'success' || 'failure' }}
          notification_title: "{workflow} has {status_message}"
          message_format: "{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>"
          footer: "<{workflow_url}|View Workflow>"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
